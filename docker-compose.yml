services:
  web:
    build: .
    container_name: gsc_ecwid_app
    ports:
      - "8082:80"
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: gsc_ecwid_db
    restart: unless-stopped
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecwid-googlesearchconsole
    ports:
      - "3308:3306"
    volumes:
      - ecwid_db_data:/var/lib/mysql

volumes:
  ecwid_db_data: